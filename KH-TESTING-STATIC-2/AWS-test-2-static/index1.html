<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Propsights</title>
  <style>
    :root{
      --bg:#0b0c10;--card:#121318;--muted:#9aa3af;--text:#e5e7eb;--accent:#60a5fa;--border:#23252d
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial}
    .wrap{max-width:1100px;margin:24px auto;padding:0 16px}
    h1{margin:0 0 20px;font-size:28px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
    .tab{border:1px solid var(--border);background:#161821;color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer}
    .tab.active{outline:2px solid var(--accent);color:white}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin:14px 0}
    .muted{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:1fr;gap:14px}
    img.chart{width:100%;height:auto;border-radius:10px;border:1px solid var(--border);background:#0f1015}
    .hidden{display:none}
    table{width:100%;border-collapse:collapse;border:1px solid var(--border);border-radius:10px;overflow:hidden}
    th,td{padding:8px 10px;border-bottom:1px solid var(--border)}
    th{text-align:left;color:#cbd5e1;background:#0f1116}
    .right{text-align:right}
    .pill{display:inline-block;padding:.2rem .5rem;border:1px solid var(--border);border-radius:999px;color:#cbd5e1}
    a{color:var(--accent);text-decoration:none}
    .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Propsights</h1>

    <!-- Tabs -->
    <div class="tabs" id="tabs">
      <button class="tab active" data-target="overview">Overview</button>
      <button class="tab" data-target="flat-model">Flat Model</button>
      <button class="tab" data-target="storey-range">Storey Range</button>
      <button class="tab" data-target="remaining-years">Remaining Years</button>
      <button class="tab" data-target="txn-year">Transactions / Year</button>
      <button class="tab" data-target="price-violin">Price per sqm (Violin)</button>
      <button class="tab" data-target="corr-matrix">Correlation Matrix</button>
    </div>

    <!-- OVERVIEW -->
    <section id="overview" class="grid">
      <div class="card">
        <img class="chart" src="assets/charts/transactions_by_town.png" alt="Transactions by Town (%)" />
        <div class="muted">This chart is regenerated by the ETL Lambda.</div>
      </div>

      <div class="card">
        <div class="flex">
          <h3 style="margin:.2rem 0">Top Towns (from <span class="pill">processed/eda_summary.json</span>)</h3>
          <div class="muted" id="summaryMeta"></div>
        </div>
        <div id="summaryTable" class="muted">Loading summary…</div>
      </div>
    </section>

    <!-- FLAT MODEL -->
    <section id="flat-model" class="grid hidden">
      <div class="card"><img class="chart" src="assets/charts/by_flat_model.png" alt="Transactions by Flat Model (%)" /></div>
    </section>

    <!-- STOREY RANGE -->
    <section id="storey-range" class="grid hidden">
      <div class="card"><img class="chart" src="assets/charts/by_storey_range.png" alt="Transactions by Storey Range (%)" /></div>
    </section>

    <!-- REMAINING YEARS -->
    <section id="remaining-years" class="grid hidden">
      <div class="card"><img class="chart" src="assets/charts/remaining_years_dist.png" alt="Distribution of Remaining Years" /></div>
    </section>

    <!-- TRANSACTIONS / YEAR -->
    <section id="txn-year" class="grid hidden">
      <div class="card"><img class="chart" src="assets/charts/transactions_per_year.png" alt="Number of Transactions per Year (%)" /></div>
    </section>

    <!-- PRICE PER SQM VIOLIN -->
    <section id="price-violin" class="grid hidden">
      <div class="card"><img class="chart" src="assets/charts/price_psm_by_storey_violin.png" alt="Distribution of Resale Price per sqm by Storey Range" /></div>
    </section>

    <!-- CORRELATION MATRIX -->
    <section id="corr-matrix" class="grid hidden">
      <div class="card"><img class="chart" src="assets/charts/corr_matrix.png" alt="Correlation Matrix" /></div>
    </section>

    <div class="muted" style="margin-top:20px">
      Data: HDB Resale Flat Prices (Jan 2017 onwards). Site bucket: <code>karhwee-site-propsights</code>.
    </div>
  </div>

  <script>
    // --- Tab switching
    const tabs = document.querySelectorAll('.tab');
    const sections = [...document.querySelectorAll('section')];
    tabs.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        tabs.forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const tgt = btn.dataset.target;
        sections.forEach(s=>s.classList.toggle('hidden', s.id !== tgt));
        // Prevent stale cache on images when you redeploy charts
        document.querySelectorAll('#'+tgt+' img.chart').forEach(img=>{
          const u = new URL(img.src, location.href);
          u.searchParams.set('t', Date.now()); // cache-bust
          img.src = u.toString();
        });
      });
    });

    // --- Try load summary JSON (prefer same-origin; fallback to data bucket if needed)
    async function loadSummary() {
      const candidates = [
        // same-origin copy (Lambda will upload this to site bucket too)
        'processed/eda_summary.json',
        // fallback to data bucket website endpoint (works if you left it public + CORS)
        'http://karhwee-data-propsights.s3-website-ap-southeast-1.amazonaws.com/processed/eda_summary.json'
      ];
      let data=null, src=null;
      for (const url of candidates) {
        try {
          const r = await fetch(url, {cache:'no-store'});
          if (r.ok) { data = await r.json(); src = url; break; }
        } catch(e) {}
      }
      const meta = document.getElementById('summaryMeta');
      const mount = document.getElementById('summaryTable');

      if (!data || !data.town_stats) {
        mount.textContent = 'Failed to load summary.';
        return;
      }
      // Meta: updated_at + n_rows
      const updated = data.updated_at ?? '';
      const rows = data.n_rows ?? '';
      meta.textContent = `Updated: ${updated} • Rows: ${rows}`;

      // Build table
      const rowsHtml = data.town_stats
        .map(r => `<tr><td>${r.town}</td><td class="right">${(+r.percent).toFixed(2)}%</td></tr>`)
        .join('');
      mount.innerHTML = `
        <table>
          <thead><tr><th>Town</th><th class="right">%</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>`;
    }
    loadSummary();
  </script>
</body>
</html>
