<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Propsights</title>
  <style>
    body { font-family: system-ui, -apple-system, Arial, sans-serif; margin: 24px; }
    h1 { margin: 0 0 12px; }
    .chart { max-width: 980px; }
    table { border-collapse: collapse; margin-top: 16px; }
    th, td { border: 1px solid #ddd; padding: 6px 10px; }
    th { background: #f7f7f7; text-align: left; }
    .muted { color: #777; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>Propsights</h1>

  <div class="chart">
    <img src="assets/charts/transactions_by_town.png" alt="Transactions by Town Chart" style="width:100%;max-width:980px;" />
    <div class="muted">This chart is regenerated by the ETL Lambda.</div>
  </div>

  <h2>Top Towns (from eda_summary.json)</h2>
  <div id="summary" class="muted">Loading…</div>
  <table id="town-table" style="display:none;">
    <thead><tr><th>Town</th><th>%</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    async function load() {
      try {
        const res = await fetch('data/eda_summary.json', { cache: 'no-cache' });
        const json = await res.json();
        document.getElementById('summary').textContent =
          `Updated: ${json.updated_at} — Rows: ${json.n_rows}`;

        const rows = json.town_stats || [];
        const tbody = document.querySelector('#town-table tbody');
        tbody.innerHTML = rows.map(r =>
          `<tr><td>${r.town}</td><td>${r.percent.toFixed ? r.percent.toFixed(2) : r.percent}%</td></tr>`
        ).join('');

        if (rows.length) document.getElementById('town-table').style.display = '';
      } catch (e) {
        document.getElementById('summary').textContent = 'Failed to load summary.';
        console.error(e);
      }
    }
    load();
  </script>
</body>
</html>
