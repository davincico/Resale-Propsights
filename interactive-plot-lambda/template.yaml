AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lambda API to process resale CSV data from S3

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: python3.10
    Architectures:
      - x86_64

Resources:
  ResaleApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: fetch-data-polars-api-v2
      StageName: prod
      Cors:
        AllowMethods: "'GET,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"
  
  ResaleDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: fetch-data-polars-api-v2
      Handler: app.lambda_handler
      CodeUri: fetch_data/
      Description: Processes resale house data from CSV stored in S3
      Environment:
        Variables:
          BUCKET_NAME: www.propsights.site
          PARQUET_PATH: cleaned/clean.parquet/  # Note: trailing slash for directory
      Policies:
        - S3ReadPolicy:
            BucketName: www.propsights.site
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /process
            Method: get
            RestApiId: !Ref ResaleApi

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ResaleApi}.execute-api.${AWS::Region}.amazonaws.com/prod/process"
