--- # This workflow will build and deploy a React application to AWS CloudFront on every push to the davin_dev branch
name: Build and Deploy React App to CloudFront
on:
  push:
    branches: [davin_dev]

jobs:
  build-and-deploy:
    name : Build and Deploy
    runs-on: ubuntu-latest
    env:    
        AWS_REGION: ap-southeast-1 # your-aws-region
        DIST: build # your-build-directory
        S3_BUCKET: www.propsights.site # your-s3-bucket-name
        CLOUDFRONT_DISTRIBUTION_ID: E3F5STDTIPPOE2 # your-cloudfront-distribution-id

    steps:
    - name: Checkout code
      uses: actions/checkout@v3 # Clone repostitory to the runner

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # If specific Node.js version is required, uncomment the following step
    # - name: Set up Node.js    
    #   uses: actions/setup-node@v3
    #   with:   
    #     node-version: '16' # Specify the Node.js version

    - name: Install dependencies
      run: |
        node --version 
        npm ci --production

    - name: Build the React app
      run: npm run build

    - name: Deploy to S3 using AWS CLI
      run: |
        aws s3 sync --delete ${{ env.DIST }} s3://${{ env.S3_BUCKET }} 

    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

# Note: Create an IAM user with programmatic access and attach a policy with permissions to S3 and CloudFront.